  <script>
  /* Offline scopes (path prefixes) + the reload guard shared with root-config (src/libs/offline/reloadGuard.ts is its tested twin). */
  (function () {
    var scopes = [];
    window.__LINM_OFFLINE_SCOPES__ = scopes;
    function scopeOf(path) {
      for (var i = 0; i < scopes.length; i++) {
        var s = scopes[i];
        if (typeof s === 'string' && s && path.indexOf(s) === 0) return s;
      }
      return null;
    }
    /* The scope this document was loaded under ('' when none): later history navigation does not change it. */
    var docScope = scopeOf(location.pathname || '/');
    window.__LINM_DOC_OFFLINE_SCOPE__ = docScope || '';
    /* Warm-up list comes from resource timing: room for more than the default 250 entries. */
    if (docScope) {
      try {
        if (window.performance && typeof performance.setResourceTimingBufferSize === 'function') {
          performance.setResourceTimingBufferSize(1000);
        }
      } catch (e) { /* keep the default buffer */ }
    }
    if (typeof Promise === 'undefined') return;
    function probe() {
      return new Promise(function (resolve) {
        var settled = false;
        var timer = null;
        function finish(v) {
          if (settled) return;
          settled = true;
          if (timer) clearTimeout(timer);
          resolve(v);
        }
        timer = setTimeout(function () { finish(false); }, 4000);
        try {
          fetch('/_manifest.json?linm-probe=1&_=' + Date.now(), { cache: 'no-store' })
            .then(function () { finish(true); }, function () { finish(false); });
        } catch (e) { finish(false); }
      });
    }
    /* 'go' | 'defer' | 'skip' — never rejects. */
    window.__LINM_MAY_RELOAD__ = function () {
      try {
        if (window.__LINM_DEFER_RELOAD__ === true) return Promise.resolve('defer');
        /* Load-time scope: a reload fetches the document from where it was loaded, wherever the app navigated since. */
        if (!docScope) return Promise.resolve('go');
        if (navigator.onLine === false) return Promise.resolve('skip');
        return probe().then(function (ok) {
          /* The user may have entered a form while the probe was in flight. */
          if (window.__LINM_DEFER_RELOAD__ === true) return 'defer';
          return ok ? 'go' : 'skip';
        });
      } catch (e) {
        return Promise.resolve('skip');
      }
    };
  })();
  </script>
  
  
  
  <script>
  (function () {
    var BUILD = "1.17.0";
    var KEY = 'linm:root-build';
    var GUARD = 'linm:root-build-reload';
    /* Offline-scope copies (caches 'linm-offline:*', worker /sw-offline.js) belong to the offline app: never wiped here. */
    var offlineScopes = window.__LINM_OFFLINE_SCOPES__ || [];
    var inOfflineScope = false;
    for (var si = 0; si < offlineScopes.length; si++) {
      var sc = offlineScopes[si];
      if (typeof sc === 'string' && sc && (location.pathname || '/').indexOf(sc) === 0) inOfflineScope = true;
    }
    var isOfflineCache = function (k) { return String(k).indexOf('linm-offline:') === 0; };
    var isOfflineReg = function (r) {
      var ws = [r.active, r.waiting, r.installing];
      for (var wi = 0; wi < ws.length; wi++) {
        if (ws[wi] && ws[wi].scriptURL && String(ws[wi].scriptURL).indexOf('/sw-offline.js') !== -1) return true;
      }
      /* No worker object yet: recognise it by its scope path. */
      var scopePath = String(r.scope || '').replace(/^[a-z][a-z0-9+.-]*:\/\/[^\/]*/i, '');
      for (var oi = 0; oi < offlineScopes.length; oi++) {
        if (scopePath === offlineScopes[oi]) return true;
      }
      return false;
    };
    var reload = function () {
      /* A form was opened meanwhile: keep the input; the next load runs this build. */
      if (window.__LINM_DEFER_RELOAD__ === true) return;
      location.reload();
    };
    var cleanupAndReload = function () {
        sessionStorage.setItem(GUARD, BUILD);
        localStorage.setItem(KEY, BUILD);
        var pending = 1;
        var done = function () { pending -= 1; if (pending <= 0) reload(); };
        if (window.caches && caches.keys) {
          pending += 1;
          caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return !isOfflineCache(k); }).map(function (k) { return caches.delete(k); }));
          }).then(done).catch(done);
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          pending += 1;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.filter(function (r) { return !isOfflineReg(r); }).map(function (r) { return r.unregister(); }));
          }).then(done).catch(done);
        }
        setTimeout(reload, 400);
    };
    try {
      var prev = localStorage.getItem(KEY);
      if (prev && prev !== BUILD) {
        /* Offline inside an offline scope: this document is a stored copy — leave everything for the next online load. */
        if (inOfflineScope && navigator.onLine === false) return;
        if (sessionStorage.getItem(GUARD) === BUILD) {
          localStorage.setItem(KEY, BUILD);
          return;
        }
        /* Inside an offline scope the network may be dead though reported online: wipe and reload only on 'go'
           ('skip' / 'defer': touch nothing, store no key — the next load tries again). */
        if (inOfflineScope && typeof window.__LINM_MAY_RELOAD__ === 'function') {
          window.__LINM_MAY_RELOAD__().then(function (decision) {
            if (decision !== 'go') return;
            try { cleanupAndReload(); } catch (e) { /* private mode */ }
          });
          return;
        }
        cleanupAndReload();
        return;
      }
      localStorage.setItem(KEY, BUILD);
    } catch (e) { /* private mode */ }
  })();
  </script>

  <!-- Prod: _manifest.json · local host: _manifest.local.json -->
  <script>
    (async function() {
      function resolveLinmManifestPath(publicUrl) {
        var q = new URLSearchParams(location.search);
        var override = String(q.get('linm_manifest') || q.get('manifest') || '').toLowerCase();
        if (override) {
          try { sessionStorage.setItem('linm_manifest', override); } catch (e) {}
        }
        var host = location.hostname;
        var isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
        var file;
        if (override === 'local' || override === 'dev') {
          file = '/_manifest.local.json';
        } else if (override === 'deploy' || override === 'prod' || override === 'remote') {
          file = '/_manifest.json';
        } else {
          file = isLocalHost ? '/_manifest.local.json' : '/_manifest.json';
        }
        return (publicUrl || '') + file;
      }

      async function fetchLinmManifest(publicUrl) {
        var primary = resolveLinmManifestPath(publicUrl);
        var fallback = (publicUrl || '') + '/_manifest.json';
        var url = primary + '?_=' + Date.now();
        var response = await fetch(url, {
          cache: 'no-store',
          headers: { 'Pragma': 'no-cache' }
        });
        var isLocalFile = /_manifest\.local\.json/.test(primary);
        if (!response.ok && isLocalFile && primary !== fallback) {
          console.warn('[Manifest Loader]', primary, 'failed (' + response.status + ') — fallback _manifest.json');
          url = fallback + '?_=' + Date.now();
          response = await fetch(url, {
            cache: 'no-store',
            headers: { 'Pragma': 'no-cache' }
          });
          primary = fallback;
        }
        window.__LINM_MANIFEST_FILE__ = primary;
        return { response: response, url: url };
      }

      try {
        const loaded = await fetchLinmManifest('');
        const response = loaded.response;
        const manifestUrl = loaded.url;
        console.log('[Manifest Loader] Fetching:', manifestUrl);
        
        if (!response.ok) {
          console.warn('[Manifest Loader] Failed to fetch manifest:', response.status);
          return;
        }
        
        const manifest = await response.json();
        console.log('[Manifest Loader] Loaded manifest:', manifest);

        const LEGACY_MF_ALIASES = {"@linm/inc":"@linm/m-inc","@linm/medical-incidents":"@linm/m-inc"};
        const resolveMfeName = (name) => LEGACY_MF_ALIASES[name] || name;

        // Merge legacy manifest keys (e.g. @linm/inc) into canonical (@linm/m-inc).
        if (manifest.microfrontends) {
          for (const [legacyName, canonicalName] of Object.entries(LEGACY_MF_ALIASES)) {
            const legacyEntry = manifest.microfrontends[legacyName];
            if (!legacyEntry) continue;
            const canonicalEntry = manifest.microfrontends[canonicalName] || {};
            manifest.microfrontends[canonicalName] = {
              ...legacyEntry,
              ...canonicalEntry,
              url: canonicalEntry.url || legacyEntry.url,
              filename: canonicalEntry.filename || legacyEntry.filename,
              routes: Array.from(new Set([
                ...(legacyEntry.routes || []),
                ...(canonicalEntry.routes || []),
              ])),
            };
            delete manifest.microfrontends[legacyName];
            console.log(`[Manifest Loader] Merged legacy ${legacyName} → ${canonicalName}`);
          }
        }

        window.__LINM_MF_MANIFEST__ = manifest;
        window.__LINM_MANIFEST_TS__ = manifest.timestamp || '';

        (function applyLinmRuntimeEnv(m) {
          function isForceBffOn(v) {
            return v === true || v === 'true' || v === 1 || v === '1';
          }
          var mf = (m && m.microfrontends) || {};
          var rootEnv = (mf['@linm/root-config'] && mf['@linm/root-config'].env) || {};
          var siteEnv = (m && m.env) || {};
          var forceOn = isForceBffOn(siteEnv.FORCE_BFF_DOMAIN) || isForceBffOn(rootEnv.FORCE_BFF_DOMAIN);
          var api = String(rootEnv.VITE_API_URL || siteEnv.VITE_API_URL || window.__LINM_AUTH_BFF_BUILD__ || '')
            .trim()
            .replace(/\/$/, '');

          if (forceOn) {
            if (!api) {
              console.error('[Manifest Loader] FORCE_BFF_DOMAIN=true but @linm/root-config env.VITE_API_URL is empty');
            } else {
              if (!m.env) m.env = {};
              m.env.FORCE_BFF_DOMAIN = true;
              Object.keys(mf).forEach(function (name) {
                if (!mf[name].env) mf[name].env = {};
                mf[name].env.VITE_API_URL = api;
                mf[name].env.FORCE_BFF_DOMAIN = true;
              });
              window.__LINM_FORCE_BFF_DOMAIN__ = true;
              console.log('[Manifest Loader] FORCE_BFF_DOMAIN=true → all MFE VITE_API_URL', api);
            }
          }

          window.__LINM_RUNTIME_ENV__ = Object.assign({}, rootEnv, {
            FORCE_BFF_DOMAIN: forceOn,
            VITE_API_URL: api || rootEnv.VITE_API_URL,
          });
          if (!api) return;
          window.__LINM_AUTH_BFF_BASE__ = api;
          if (!forceOn) console.log('[Manifest Loader] @linm/root-config env.VITE_API_URL →', api);
        })(manifest);
        
        // Wait for System to be available
        if (typeof System === 'undefined') {
          console.warn('[Manifest Loader] SystemJS not yet loaded, retrying...');
          await new Promise(resolve => setTimeout(resolve, 100));
          return;
        }
        
        // v1/v2 + local: MFE_SIGNED_KEY_ENABLE=false → unsigned import map.
        // v3 (mfe-deploy.yml): true → Ed25519 fail-closed.
        if (manifest.microfrontends) {
          const imports = {};
          const signedOn = window.__MFE_SIGNED_KEY_ENABLE__ === true;

          const applyAliasesAndOverrides = () => {
            for (const [legacyName, canonicalName] of Object.entries(LEGACY_MF_ALIASES)) {
              if (imports[canonicalName]) {
                imports[legacyName] = imports[canonicalName];
              }
            }
            if (window.__LINM_ALLOW_MF_OVERRIDES__ && window.importMapOverrides) {
              const overrideMap = window.importMapOverrides.getOverrideMap();
              Object.entries(overrideMap.imports || {}).forEach(([name, url]) => {
                console.log(`[Manifest Loader] Override ${name} → ${url}`);
                imports[name] = url;
              });
            }
            Object.entries(imports).forEach(([name, url]) => {
              console.log(`  ✓ ${name} → ${url}`);
            });
            System.addImportMap({ imports });
          };

          if (!signedOn) {
            console.warn('[Manifest Loader] MFE_SIGNED_KEY_ENABLE=false — unsigned import map (v1/v2 / local)');
            for (const [name, info] of Object.entries(manifest.microfrontends)) {
              if (info && info.url) imports[resolveMfeName(name)] = info.url;
            }
            applyAliasesAndOverrides();
            console.log('[Manifest Loader] Import map updated:', Object.keys(imports).length, 'unsigned entries');
          } else {
            const verify = window.LinmMfVerify;
            const trustPem = window.__LINM_MF_TRUST_PEM__ || '';
            let keyring = null;
            try {
              const keyringUrl = '/_mfe-keys.json?_=' + Date.now();
              const keyringRes = await fetch(keyringUrl, { cache: 'no-store', headers: { 'Pragma': 'no-cache' } });
              if (keyringRes.ok) keyring = await keyringRes.json();
            } catch (keyringErr) {
              console.error('[Manifest Loader] _mfe-keys.json fetch failed:', keyringErr);
            }

            const verifyKeyring = verify && (verify.verifyKeyring || verify.verifyKeyring);
            const verifyEntry = verify && (verify.verifyEntry || verify.verifyEntry);
            const ringOk = verifyKeyring && trustPem && keyring
              ? await verifyKeyring(keyring, trustPem)
              : false;
            if (!ringOk) {
              console.error('[Manifest Loader] keyring/trust invalid — no MFE import map entries');
            } else {
              for (const [name, info] of Object.entries(manifest.microfrontends)) {
                const pub = keyring.keys && keyring.keys[name] && keyring.keys[name].publicKeyPem;
                const ok = verifyEntry ? await verifyEntry(name, info, pub) : false;
                if (!ok) {
                  console.error('[Manifest Loader] skip unsigned/invalid MFE', name);
                  continue;
                }
                imports[resolveMfeName(name)] = info.url;
              }
              applyAliasesAndOverrides();
              console.log('[Manifest Loader] Import map updated:', Object.keys(imports).length, 'signed entries');
            }
          }
        }
      } catch (err) {
        console.error('[Manifest Loader] Error:', err);
      } finally {
        // Pre-load shared deps sequentially so react-dom always finds window.React.
        // SystemJS core has no AMD support, so both files fall through to UMD global
        // mode. Without sequential loading, concurrent network fetches (e.g. DevTools
        // "Disable cache") can execute react-dom before react sets window.React.
        try { await System.import('react'); } catch(e) { console.error('[Manifest Loader] react preload failed:', e); }
        try { await System.import('react-dom'); } catch(e) { console.error('[Manifest Loader] react-dom preload failed:', e); }
        System.import('@linm/root-config');
      }
    })();
  </script>

  <script>
    (function() {
      if (!('serviceWorker' in navigator)) return;

      var RELOAD_KEY = '_mf_deploy_reload_ts';
      var RELOAD_WINDOW_MS = 30 * 60 * 1000;  // 30 minutes
      var MAX_RELOADS = 3;

      // count === false: only test the cap. Returns false when the cap is reached.
      function deployReloadAllowed(count) {
        var now = Date.now();
        try {
          var raw = sessionStorage.getItem(RELOAD_KEY);
          var timestamps = raw ? JSON.parse(raw) : [];
          var recent = timestamps.filter(function(t) { return now - t < RELOAD_WINDOW_MS; });
          if (recent.length >= MAX_RELOADS) return false;
          if (count) {
            recent.push(now);
            sessionStorage.setItem(RELOAD_KEY, JSON.stringify(recent));
          }
        } catch(e) {
          if (Number(sessionStorage.getItem('_mf_deploy_reload') || 0) >= 2) return false;

      }

      // Ask the reload guard until it stops saying 'defer', then done('go' | 'skip').
      // While deferred: re-ask when the page is hidden, on pagehide (navigation), and on a slow 60 s fallback tick.
      function awaitReloadDecision(guard, done) {

        var finished = false;

        }

          try { p = Promise.resolve(guard()); } catch (e) { p = Promise.resolve('skip'); }
          p.then(function(d) { return d; }, function() { return 'skip'; }).then(function(d) {
            busy = false;
            if (finished) return;
            if (d === 'defer') {
              if (timer === null) {
                timer = setInterval(evaluate, 60 * 1000);
                document.addEventListener('visibilitychange', onVisibility);
                window.addEventListener('pagehide', onPageHide);
              }
              return;
            }
            finished = true;
            if (timer !== null) clearInterval(timer);
            document.removeEventListener('visibilitychange', onVisibility);
